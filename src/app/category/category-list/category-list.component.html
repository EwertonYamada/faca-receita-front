<div class="category">

  <div class="row">
    <div class="col-md-11">
      <window-title [windowTitle]="{ icon: 'topic', label: 'Categorias' }"></window-title>
    </div>
    
    <div class="col-md-1 button-area">
      <button mat-icon-button (click)="newCategory()" title="Nova categoria">
        <mat-icon>add_box</mat-icon>
      </button>
    </div>
  </div>

  <div class="row col-md-12">
    <form [formGroup]="searchForm">
      <div class="row">
        <div class="input-area col-md-4">
          <label>Categoria</label>
          <input type="text" formControlName="category" placeholder="Busque uma categoria..." (ngModelChange)="searchCategory()"/>
        </div>
      </div>
    </form>
  </div>
 
  <div class="row table-area">
    <table mat-table [dataSource]="categoryList" class="mat-elevation-z8">

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let element">{{ element.category }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ translateStatus(element.active) }}</td>
      </ng-container>  

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let element">
            <mat-icon class="list-action-button" (click)="editCategory(element.id)">edit</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
