<div class="password-instructions">
  <ul class="pw-rules">
    <li [class.ok]="rules.upper">Pelo menos 1 letra maiúscula (A–Z).</li>
    <li [class.ok]="rules.lower">Pelo menos 1 letra minúscula (a–z).</li>
    <li [class.ok]="rules.number">Pelo menos 1 número (0–9).</li>
    <li [class.ok]="rules.special">Pelo menos 1 caractere especial.</li>
    <li [class.ok]="rules.length">Mínimo de 8 caracteres.</li>
  </ul>
</div>
