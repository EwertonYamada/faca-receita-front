<div class="category-form">

  <div class="row col-md-12">
    <div class="col-md-11">
      <window-title [windowTitle]="{ icon: 'topic', label: 'Cadastro de categoria' }"></window-title>
    </div>
  </div>

  <div class="row col-md-12">
    <form [formGroup]="categoryForm">
      <div class="row">
        <div class="input-area col-md-6">
          <label>Categoria</label>
          <input type="text" formControlName="category" placeholder="Digite o nome da categoria" />
        </div>
        <div class="input-area col-md-6">
          <label>Descrição</label>
          <input type="text" formControlName="description" placeholder="Digite uma descirção da categoria" />
        </div>
      </div>
    </form>
  </div>
 
  <app-finish-button 
    confirmLabel="SALVAR"
    (onConfirm)="save()"
    (onCancel)="cancel()">
  </app-finish-button>
</div>
